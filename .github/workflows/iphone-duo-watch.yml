name: iPhone Duo stock watch

# One run watches continuously: it checks every 30 seconds for five and a half
# hours, then starts the next run before it ends.
#
# A watcher starts by itself when a change to it is merged to main or pushed to
# a pull request from this repository; that run replaces the one in progress.
# The schedule is only a safety net that starts a watcher when none is running.
#
# To stop it: disable this workflow in the Actions tab, then cancel the run in
# progress.

on:
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a test push instead of checking stock
        type: boolean
        default: false
      minutes:
        description: Minutes this run keeps watching before handing over
        type: number
        default: 330
  push:
    branches: [main]
    paths:
      - watch_iphone_duo.py
      - refresh_apple_stores.py
      - apple_stores_us.json
      - tests/**
      - .github/workflows/iphone-duo-watch.yml
  pull_request:
    paths:
      - watch_iphone_duo.py
      - refresh_apple_stores.py
      - apple_stores_us.json
      - tests/**
      - .github/workflows/iphone-duo-watch.yml

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Live check from a GitHub runner (sample ZIP, nothing sent)
        run: python3 watch_iphone_duo.py --dry-run --verbose
        env:
          DUO_ZIP: "10001"

  gate:
    # A scheduled run starts a watcher only when no other run is active. Pull
    # requests from forks never start one: they have no access to the secrets.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      start: ${{ steps.decide.outputs.start }}
    steps:
      - name: Decide whether to start a watcher
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            others=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow iphone-duo-watch.yml \
              --limit 30 --json databaseId,status \
              --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length" \
              || echo 0)
            if [ "$others" -gt 0 ]; then
              start=false
              echo "A watcher is already running."
            fi
          fi
          echo "start=$start" >> "$GITHUB_OUTPUT"

  watch:
    needs: gate
    if: needs.gate.outputs.start == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write
    concurrency:
      group: iphone-duo-watch
      # New code replaces the watcher in progress; a handover waits for it to end.
      cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    env:
      DUO_ZIP: ${{ secrets.DUO_ZIP }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      DUO_PARTS: ${{ vars.DUO_PARTS }}
      DUO_MAX_MILES: ${{ vars.DUO_MAX_MILES }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -n "$DUO_ZIP" ] && [ -n "$NTFY_TOPIC" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::warning::Not watching yet: add the DUO_ZIP and NTFY_TOPIC repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Add the DUO_ZIP and NTFY_TOPIC repository secrets first."
            exit 1
          fi

      - uses: actions/checkout@v6
        if: steps.config.outputs.ready == 'true'

      - name: Send test notification
        if: ${{ steps.config.outputs.ready == 'true' && inputs.test_notification }}
        run: python3 watch_iphone_duo.py --test-notify

      - name: Restore what was already announced
        if: ${{ steps.config.outputs.ready == 'true' && !inputs.test_notification }}
        uses: actions/cache/restore@v5
        with:
          path: .duo-state.json
          key: duo-state-${{ github.run_id }}
          restore-keys: duo-state-

      - name: Watch, checking every 30 seconds
        id: watch
        if: ${{ steps.config.outputs.ready == 'true' && !inputs.test_notification }}
        run: python3 watch_iphone_duo.py --loop 30 --minutes "$MINUTES"
        env:
          # A pull request run is short, so that its handover is exercised too.
          MINUTES: ${{ inputs.minutes || (github.event_name == 'pull_request' && 3) || 330 }}

      - name: Remember what was announced
        if: ${{ always() && steps.watch.conclusion != 'skipped' && hashFiles('.duo-state.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .duo-state.json
          key: duo-state-${{ github.run_id }}

      - name: Hand over to a fresh run
        if: ${{ success() && steps.watch.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: gh workflow run iphone-duo-watch.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
