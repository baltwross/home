name: iPhone Duo stock watch

# The watcher is off: nothing here starts by itself.
#
# To start it, run this workflow by hand from the Actions tab. One run then
# checks every 30 seconds for five and a half hours and starts the next run
# before it ends, so it keeps going until you cancel the run in progress.

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a test push instead of checking stock
        type: boolean
        default: false
      minutes:
        description: Minutes this run keeps watching before handing over
        type: number
        default: 330
  pull_request:
    paths:
      - watch_iphone_duo.py
      - refresh_apple_stores.py
      - apple_stores_us.json
      - tests/**
      - .github/workflows/iphone-duo-watch.yml

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Live check from a GitHub runner (sample ZIP, nothing sent)
        run: python3 watch_iphone_duo.py --dry-run --verbose
        env:
          DUO_ZIP: "10001"

  stop:
    # One-off: takes the watcher's slot, which ends the run in progress and any
    # run waiting behind it. A cancelled run does not hand over.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: iphone-duo-watch
      cancel-in-progress: true
    steps:
      - run: echo "Watcher stopped."

  watch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write
    concurrency:
      group: iphone-duo-watch
      # A handover waits for the run in progress to end.
      cancel-in-progress: false
    env:
      DUO_ZIP: ${{ secrets.DUO_ZIP }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      DUO_PARTS: ${{ vars.DUO_PARTS }}
      DUO_MAX_MILES: ${{ vars.DUO_MAX_MILES }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -n "$DUO_ZIP" ] && [ -n "$NTFY_TOPIC" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Add the DUO_ZIP and NTFY_TOPIC repository secrets first."
            exit 1
          fi

      - uses: actions/checkout@v6
        if: steps.config.outputs.ready == 'true'

      - name: Send test notification
        if: ${{ steps.config.outputs.ready == 'true' && inputs.test_notification }}
        run: python3 watch_iphone_duo.py --test-notify

      - name: Restore what was already announced
        if: ${{ steps.config.outputs.ready == 'true' && !inputs.test_notification }}
        uses: actions/cache/restore@v5
        with:
          path: .duo-state.json
          key: duo-state-${{ github.run_id }}
          restore-keys: duo-state-

      - name: Watch, checking every 30 seconds
        id: watch
        if: ${{ steps.config.outputs.ready == 'true' && !inputs.test_notification }}
        run: python3 watch_iphone_duo.py --loop 30 --minutes "$MINUTES"
        env:
          MINUTES: ${{ inputs.minutes || 330 }}

      - name: Remember what was announced
        if: ${{ always() && steps.watch.conclusion != 'skipped' && hashFiles('.duo-state.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .duo-state.json
          key: duo-state-${{ github.run_id }}

      - name: Hand over to a fresh run
        if: ${{ success() && steps.watch.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: gh workflow run iphone-duo-watch.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
