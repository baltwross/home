name: iPhone Duo stock watch

on:
  schedule:
    # Every 5 minutes (GitHub's minimum), offset from the busy top of the hour.
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a test push instead of checking stock
        type: boolean
        default: false
  pull_request:
    paths:
      - watch_iphone_duo.py
      - tests/**
      - .github/workflows/iphone-duo-watch.yml

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Live check from a GitHub runner (sample ZIP, nothing sent)
        run: python3 watch_iphone_duo.py --dry-run --verbose
        env:
          DUO_ZIP: "10001"

  watch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: iphone-duo-watch
      cancel-in-progress: false
    env:
      DUO_ZIP: ${{ secrets.DUO_ZIP }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      DUO_PARTS: ${{ vars.DUO_PARTS }}
      DUO_MAX_MILES: ${{ vars.DUO_MAX_MILES }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -n "$DUO_ZIP" ] && [ -n "$NTFY_TOPIC" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::warning::Not watching yet: add the DUO_ZIP and NTFY_TOPIC repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Add the DUO_ZIP and NTFY_TOPIC repository secrets first."
            exit 1
          fi

      - uses: actions/checkout@v6
        if: steps.config.outputs.ready == 'true'

      - name: Send test notification
        if: ${{ steps.config.outputs.ready == 'true' && inputs.test_notification }}
        run: python3 watch_iphone_duo.py --test-notify

      - name: Restore what was already announced
        if: ${{ steps.config.outputs.ready == 'true' && !inputs.test_notification }}
        uses: actions/cache/restore@v5
        with:
          path: .duo-state.json
          key: duo-state-${{ github.run_id }}
          restore-keys: duo-state-

      - name: Check stock and notify
        id: check
        if: ${{ steps.config.outputs.ready == 'true' && !inputs.test_notification }}
        run: python3 watch_iphone_duo.py

      - name: Remember what was announced
        if: steps.check.outputs.state_changed == 'true'
        uses: actions/cache/save@v5
        with:
          path: .duo-state.json
          key: duo-state-${{ github.run_id }}
